<!-- ================================================================
     FIREBASE AYARLARI — kendi Firebase projenizin bilgilerini

<style>
  * { box-sizing: border-box; }

  body {
    min-height: 100vh;

  .islem-alt { font-size: 11.5px; color: #8A7F6A; margin: 2px 0 0; }
  .islem-tutar { font-family: monospace; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .sil-btn { border: none; background: none; color: #B4A98F; cursor: pointer; display: flex; padding: 4px; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(35,52,46,0.45); display: flex;
    align-items: flex-end; justify-content: center; z-index: 50;

  .modal-title { font-size: 18px; font-weight: 800; margin: 0; }
  .form-label { font-size: 12px; color: #7A6A55; font-weight: 600; display: block; margin: 12px 0 5px; }
  .input {

  .kaydet-btn {

    border-radius: 12px; padding: 13px 0; font-weight: 700; font-size: 14px; cursor: pointer;

  .uyari { background: #F6E4DC; color: #8B3A3A; font-size: 12px; border-radius: 10px; padding: 8px 10px; margin-top: 10px; }

  /* giriş ekranı (hane kodu) */
  .giris-sarmalayici { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .giris-kart { background: #FBF8F1; border: 1px solid #E4DCC6; border-radius: 18px; padding: 28px 22px; max-width: 380px; width: 100%; text-align: center; }

<script>
/* =========================================================
   FIREBASE YAPILANDIRMASI
   Kendi Firebase projenizin bilgilerini buraya yapıştırın.
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyA-SAjvNs8SJdsvnCKeOh4nM3koFFlgxmI",
  authDomain: "hane-gelir-gider-d75f7.firebaseapp.com",
  databaseURL: "https://hane-gelir-gider-d75f7-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hane-gelir-gider-d75f7",
  storageBucket: "hane-gelir-gider-d75f7.firebasestorage.app",
  messagingSenderId: "858232416026",
  appId: "1:858232416026:web:f97f7f146716ab38f92ea3"
};

/* ========================================================= */

const GIDER_KATEGORI = [
  "Market", "Pazar Alışverişi", "Yemek (Dışarıda)", "İçecek",
  "Kira", "Aidat", "Elektrik", "Su", "Doğalgaz", "İnternet", "Telefon", "Abonelikler", "Ev Eşyası",
  "Akaryakıt", "Otopark", "Araç Bakım Onarım", "Sigorta", "Toplu Taşıma / Taksi",
  "Sağlık", "İlaç", "Muayene",
  "Elbise", "Ayakkabı", "Kişisel Bakım", "Kırtasiye", "Eğitim", "Oyuncak", "Teknolojik Eşyalar", "Hediye", "Eğlence",
  "Vergi / Harç", "Diğer",
];
const GELIR_KATEGORI = ["Maaş","Ek İş","Kira Geliri","Diğer"];
const YATIRIM_KATEGORI = ["Birikim Hesabı","Altın","Döviz","Borsa / Fon","Kripto","Diğer"];
const KATEGORI_RENK = ["#4F6F52","#A85C3B","#C79A3D","#5A7D8C","#8E5B6B","#6B7A3F","#B4763F","#3F6B66","#9A6B3F","#5F5A7D","#7A6A55"];
const YATIRIM_RENGI = "#5A7D8C";
const AY_ADLARI = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

const TL = (n) => new Intl.NumberFormat("tr-TR", { style:"currency", currency:"TRY", maximumFractionDigits:0 }).format(n || 0);

let db = null;
let haneKodu = null;
let islemler = {};      // { pushId: {tur,kategori,kisi,tutar,tarih,not} }
let kartlar = {};       // { pushId: {ad, kalanBakiye} } — kredi kartı / kredi bakiyesi (sürekli güncellenen)
let kisiler = { a: "Ben", b: "Eşim" };
let ayIndex = new Date().getMonth();
let yil = new Date().getFullYear();
let kisiFiltre = "hepsi";
let kartKisiFiltre = "hepsi";
let cihazKisi = (() => {
  try { return localStorage.getItem("hane-defteri-cihaz-kisi") || "a"; } catch (e) { return "a"; }
})();
let dagilimTur = "gider";
let mevcutTur = "gider";
let raporYili = new Date().getFullYear();
let raporDagilimTur = "gider";

/* ---------- başlangıç ---------- */
window.addEventListener("DOMContentLoaded", () => {
  const kayitliKod = localStorage.getItem("hane-defteri-kodu");
  if (kayitliKod) {
    baslat(kayitliKod);
  } else {
    document.getElementById("yukleniyor-ekrani").style.display = "none";
    document.getElementById("giris-ekrani").style.display = "flex";
  }
});

function haneKoduKaydet() {
  const deger = document.getElementById("hane-kodu-input").value.trim();
  if (!deger) return;
  const guvenliKod = deger.toLowerCase().replace(/[^a-z0-9-]/g, "");
  if (!guvenliKod) { alert("Lütfen harf/rakam içeren bir kod girin."); return; }
  localStorage.setItem("hane-defteri-kodu", guvenliKod);
  baslat(guvenliKod);
}

function baslat(kod) {
  haneKodu = kod;
  document.getElementById("giris-ekrani").style.display = "none";
  document.getElementById("yukleniyor-ekrani").style.display = "flex";

  try {
    if (firebaseConfig.apiKey === "BURAYA_YAPISTIR") {
      throw new Error("Firebase yapılandırması eksik. index.html dosyasının üstündeki firebaseConfig alanını kendi Firebase bilgilerinizle doldurun.");
    }
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    document.getElementById("yukleniyor-ekrani").innerHTML =
      '<div style="max-width:380px;text-align:center;padding:20px;color:#8B3A3A;font-size:14px;">' + e.message + '</div>';
    return;
  }

  const kok = db.ref("haneler/" + haneKodu);

  kok.child("ayarlar").on("value", (snap) => {
    const v = snap.val();
    kisiler = v || { a: "Ben", b: "Eşim" };
    render();
  });

  kok.child("kartlar").on("value", (snap) => {
    kartlar = snap.val() || {};
    render();
  });

  kok.child("islemler").on("value", (snap) => {
    islemler = snap.val() || {};
    document.getElementById("yukleniyor-ekrani").style.display = "none";
    document.getElementById("uygulama").style.display = "block";
    render();
  }, (err) => {
    document.getElementById("yukleniyor-ekrani").innerHTML =
      '<div style="max-width:380px;text-align:center;padding:20px;color:#8B3A3A;font-size:14px;">Bağlantı hatası: ' + err.message + '</div>';
  });
}

/* ---------- veri yardımcıları ---------- */
function islemListesi() {
  return Object.entries(islemler).map(([id, v]) => ({ id, ...v }));
}
function buAyIslemleri() {
  return islemListesi().filter((i) => {
    const d = new Date(i.tarih);
    return d.getMonth() === ayIndex && d.getFullYear() === yil;
  });
}
function toplam(tur, liste) { return liste.filter((i) => i.tur === tur).reduce((s, i) => s + Number(i.tutar), 0); }

function islemEkle(veri) {
  db.ref("haneler/" + haneKodu + "/islemler").push(veri);
}
function islemSil(id) {
  db.ref("haneler/" + haneKodu + "/islemler/" + id).remove();
}
function kisilerKaydet(yeni) {
  db.ref("haneler/" + haneKodu + "/ayarlar").set(yeni);
}

/* ---------- kart yardımcıları ---------- */
function kartListesi() {
  return Object.entries(kartlar).map(([id, v]) => ({ id, ...v }));
}
function kartBolumRender(baslik, tumListe, tur) {
  const liste = kartKisiFiltre === "hepsi" ? tumListe : tumListe.filter((k) => k.kisi === kartKisiFiltre);
  const bosMetin = tur === "sabitkredi"
    ? `Henüz kayıtlı bir krediniz yok. Araba kredisi, ihtiyaç kredisi gibi sabit taksitli borçlarınızı eklemek için "+" butonuna basın.`
    : `Henüz kayıtlı bir kredi kartınız yok. Eklemek için "+" butonuna basın.`;
  return `
    <div class="card">
      <div class="card-header-row">
        <h2 class="card-title">${baslik}</h2>
        <div style="display:flex;gap:6px;align-items:center;">
          <select class="select-mini" onchange="kartKisiFiltreDegis(this.value)">
            <option value="hepsi" ${kartKisiFiltre==='hepsi'?'selected':''}>Herkes</option>
            <option value="a" ${kartKisiFiltre==='a'?'selected':''}>${esc(kisiler.a)}</option>
            <option value="b" ${kartKisiFiltre==='b'?'selected':''}>${esc(kisiler.b)}</option>
          </select>
          <button class="icon-btn" onclick="kartEkleFormAc('${tur}')">${IKON.arti}</button>
        </div>
      </div>
      ${tumListe.length === 0 ? `<p class="bos-metin">${bosMetin}</p>` : liste.length === 0 ? `<p class="bos-metin">Bu kişiye ait kayıt yok.</p>` : `
        <div class="bar-label-row" style="margin-bottom:10px;">
          <span style="font-weight:700;">Toplam</span>
          <span style="font-family:monospace;font-weight:700;font-size:15px;color:#8B3A3A;">${TL(liste.reduce((s,k)=>s+Number(k.kalanBakiye),0))}</span>
        </div>
        ${liste.map((k) => `
          <div style="border-top:1px solid #EFE7D4;padding:10px 0;">
            <div class="bar-label-row">
              <span style="font-weight:600;">${esc(k.ad)} <span style="font-size:11px;font-weight:600;color:#fff;background:${k.kisi==='b'?'#5A7D8C':'#8E5B6B'};border-radius:6px;padding:2px 7px;margin-left:4px;">${k.kisi==='b'?esc(kisiler.b):esc(kisiler.a)}</span></span>
              <span style="font-family:monospace;font-weight:700;color:#8B3A3A;">${TL(k.kalanBakiye)}</span>
            </div>
            ${k.aylikOdeme > 0 ? `<p style="font-size:11.5px;color:#8A7F6A;margin:2px 0 0;">Aylık sabit taksit: ${TL(k.aylikOdeme)}</p>` : ""}
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">
              ${tur === "sabitkredi" ? "" : `
              <button class="pill-btn" style="background:#EFE7D4;padding:6px 10px;" onclick="kartHarcamaFormAc('${k.id}')">+ Harcama</button>
              <button class="pill-btn" style="background:#EFE7D4;padding:6px 10px;" onclick="kartEkstreFormAc('${k.id}')">Ekstre güncelle</button>
              `}
              <button class="pill-btn" style="background:#23342E;color:#fff;padding:6px 10px;" onclick="kartOdemeFormAc('${k.id}')">Ödeme yap</button>
              <button class="sil-btn" onclick="kartSil('${k.id}')">${IKON.sil}</button>
            </div>
          </div>`).join("")}
      `}
    </div>
  `;
}
function kartEkle(ad, baslangicBakiye, kisi, aylikOdeme, tur) {
  db.ref("haneler/" + haneKodu + "/kartlar").push({
    ad,
    kalanBakiye: baslangicBakiye || 0,
    kisi: kisi || "a",
    aylikOdeme: aylikOdeme || 0,
    tur: tur || "kredikart",
  });
}
function kartSil(id) {
  if (!confirm("Bu kartı silmek istediğinize emin misiniz? (Geçmiş ödeme kayıtları işlemler listesinde kalır.)")) return;
  db.ref("haneler/" + haneKodu + "/kartlar/" + id).remove();
}
function kartHarcamaEkle(id, tutar, kategori, kisi, tarih, not) {
  const kart = kartlar[id];
  if (!kart) return;
  const yeniBakiye = Number(kart.kalanBakiye) + Number(tutar);
  db.ref("haneler/" + haneKodu + "/kartlar/" + id + "/kalanBakiye").set(yeniBakiye);
  db.ref("haneler/" + haneKodu + "/islemler").push({
    tur: "gider",
    kategori, kisi, tutar: Number(tutar), tarih,
    not: not || (kart.ad + " ile alışveriş"),
    kartId: id,
    nakitCikisi: false,
  });
}
function kartEkstreGuncelle(id, yeniBakiye) {
  const kart = kartlar[id];
  if (!kart) return;
  const fark = Number(yeniBakiye) - Number(kart.kalanBakiye);
  db.ref("haneler/" + haneKodu + "/kartlar/" + id + "/kalanBakiye").set(Number(yeniBakiye));
  if (fark > 0) {
    db.ref("haneler/" + haneKodu + "/islemler").push({
      tur: "gider",
      kategori: "Faiz / Ek Ücret",
      kisi: kart.kisi, tutar: fark, tarih: new Date().toISOString().slice(0, 10),
      not: kart.ad + " ekstre farkı (faiz/ücret)",
      kartId: id,
      nakitCikisi: false,
    });
  }
}
function kartOdemeYap(id, tutar, kisi, tarih) {
  const kart = kartlar[id];
  if (!kart) return;
  const yeniBakiye = Math.max(0, Number(kart.kalanBakiye) - Number(tutar));
  db.ref("haneler/" + haneKodu + "/kartlar/" + id + "/kalanBakiye").set(yeniBakiye);
  // kart/kredi ödemesi: gider sayılmaz (kredi kartı harcaması zaten "+ Harcama" ile,
  // sabit kredi ise kendi başına bir "harcama" değil, borç servisi), sadece nakit çıkışı olarak işaretlenir
  db.ref("haneler/" + haneKodu + "/islemler").push({
    tur: "kartodeme",
    kategori: kart.tur === "sabitkredi" ? "Kredi Taksidi" : "Kredi Kartı Ödemesi",
    kisi, tutar: Number(tutar), tarih,
    not: kart.ad + " ödemesi",
    kartId: id,
    nakitCikisi: true,
  });
}

function ayDegistir(delta) {
  ayIndex += delta;
  if (ayIndex < 0) { ayIndex = 11; yil -= 1; }
  if (ayIndex > 11) { ayIndex = 0; yil += 1; }
  render();
}

/* ---------- SVG yardımcıları ---------- */
function donutSvg(dilimler, boyut) {
  const toplamDeger = dilimler.reduce((s, d) => s + d.deger, 0);
  const cx = boyut / 2, cy = boyut / 2;
  const rOuter = boyut * 0.46, rInner = boyut * 0.29;
  const polar = (r, aci) => {
    const rad = (aci - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  };
  const yol = (a1, a2) => {
    const buyuk = a2 - a1 > 180 ? 1 : 0;
    const p1 = polar(rOuter, a2), p2 = polar(rOuter, a1), p3 = polar(rInner, a1), p4 = polar(rInner, a2);
    return `M ${p1.x} ${p1.y} A ${rOuter} ${rOuter} 0 ${buyuk} 0 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${rInner} ${rInner} 0 ${buyuk} 1 ${p4.x} ${p4.y} Z`;
  };
  let cumulative = 0;
  const gap = dilimler.length > 1 ? 2.2 : 0;
  let paths = "";
  if (toplamDeger === 0) {
    paths = `<circle cx="${cx}" cy="${cy}" r="${(rOuter+rInner)/2}" fill="none" stroke="#EFE7D4" stroke-width="${rOuter-rInner}" />`;
  } else {
    dilimler.forEach((d) => {
      const aci = (d.deger / toplamDeger) * 360;
      const b1 = cumulative + gap/2, b2 = cumulative + aci - gap/2;
      cumulative += aci;
      if (b2 > b1) paths += `<path d="${yol(b1,b2)}" fill="${d.renk}" />`;
    });
  }
  return `<svg width="${boyut}" height="${boyut}" viewBox="0 0 ${boyut} ${boyut}">${paths}</svg>`;
}

const AY_KISA = ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];

function trendSvg(gelirArr, giderArr, w, h) {
  const solPay = 6, altPay = 20, ustPay = 10, sagPay = 6;
  const genW = w - solPay - sagPay, genH = h - altPay - ustPay;
  const maxDeger = Math.max(1, ...gelirArr, ...giderArr);
  const xOf = (i) => solPay + (i / 11) * genW;
  const yOf = (v) => ustPay + genH - (v / maxDeger) * genH;
  const cizgiYolu = (arr) => arr.map((v, i) => `${i === 0 ? "M" : "L"} ${xOf(i).toFixed(1)} ${yOf(v).toFixed(1)}`).join(" ");

  let noktalar = "";
  gelirArr.forEach((v, i) => { noktalar += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="2.5" fill="#4F6F52" />`; });
  giderArr.forEach((v, i) => { noktalar += `<circle cx="${xOf(i).toFixed(1)}" cy="${yOf(v).toFixed(1)}" r="2.5" fill="#A85C3B" />`; });

  let etiketler = "";
  for (let i = 0; i < 12; i += 2) {
    etiketler += `<text x="${xOf(i).toFixed(1)}" y="${h - 4}" font-size="8" fill="#8A7F6A" text-anchor="middle">${AY_KISA[i]}</text>`;
  }

  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <line x1="${solPay}" y1="${ustPay + genH}" x2="${w - sagPay}" y2="${ustPay + genH}" stroke="#EFE7D4" stroke-width="1" />
    <path d="${cizgiYolu(gelirArr)}" fill="none" stroke="#4F6F52" stroke-width="2" />
    <path d="${cizgiYolu(giderArr)}" fill="none" stroke="#A85C3B" stroke-width="2" />
    ${noktalar}
    ${etiketler}
  </svg>`;
}

function kisiSec(k) {
  window.__secilenKisi = k;
  document.getElementById("f-kisi-a").classList.toggle("active", k === "a");
  document.getElementById("f-kisi-a").style.background = k === "a" ? "#8E5B6B" : "";
  document.getElementById("f-kisi-b").classList.toggle("active", k === "b");
  document.getElementById("f-kisi-b").style.background = k === "b" ? "#8E5B6B" : "";
}

function formGonder() {
  const tutar = parseFloat(document.getElementById("f-tutar").value.replace(",", "."));
  if (!tutar || tutar <= 0) { alert("Lütfen geçerli bir tutar girin."); return; }
  const kategori = document.getElementById("f-kategori").value;
  const tarih = document.getElementById("f-tarih").value;
  const not = document.getElementById("f-not").value.trim();
  const kisi = window.__secilenKisi || "a";
  islemEkle({ tur: mevcutTur, tutar, kategori, kisi, tarih, not, nakitCikisi: true });
  document.getElementById("form-overlay").remove();
}

/* ---------- yıllık rapor ---------- */
function yilIslemleri(yil) {
  return islemListesi().filter((i) => new Date(i.tarih).getFullYear() === yil);
}
function aylikDiziler(yil, tur) {
  const dizi = new Array(12).fill(0);
  yilIslemleri(yil).filter((i) => i.tur === tur).forEach((i) => {
    dizi[new Date(i.tarih).getMonth()] += Number(i.tutar);
  });
  return dizi;
}
function yuzdeDegisim(yeni, eski) {
  if (!eski) return yeni ? "yeni" : "—";
  const yuzde = ((yeni - eski) / eski) * 100;
  const isaret = yuzde > 0 ? "+" : "";
  return `${isaret}${yuzde.toFixed(0)}%`;
}

function yillikRaporAc() {
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";

  document.body.appendChild(overlay);
  yillikRaporRender();
}
function yillikRaporKapat() {
  const el = document.getElementById("rapor-overlay");
  if (el) el.remove();
}
function yillikRaporYilDegistir(delta) {
  raporYili += delta;
  yillikRaporRender();
}
function yillikRaporDagilimSec(tur) {
  raporDagilimTur = tur;
  yillikRaporRender();
}
function yillikRaporRender() {
  const icerik = document.getElementById("rapor-icerik");
  if (!icerik) return;

  const buYilIslemler = yilIslemleri(raporYili);
  const gecenYilIslemler = yilIslemleri(raporYili - 1);
  const buGelir = toplam("gelir", buYilIslemler);
  const buGider = toplam("gider", buYilIslemler);
  const buYatirim = toplam("yatirim", buYilIslemler);
  const gecenGelir = toplam("gelir", gecenYilIslemler);
  const gecenGider = toplam("gider", gecenYilIslemler);

  const yilNakitOdeme = buYilIslemler.filter((i) => (i.tur === "gider" && i.nakitCikisi) || i.tur === "kartodeme")
    .reduce((s, i) => s + Number(i.tutar), 0);
  const yilNakitBakiye = buGelir - yilNakitOdeme - buYatirim;

  const aylikGelir = aylikDiziler(raporYili, "gelir");
  const aylikGider = aylikDiziler(raporYili, "gider");

  const kaynak = buYilIslemler.filter((i) => i.tur === raporDagilimTur);
  const map = {};
  kaynak.forEach((i) => { map[i.kategori] = (map[i.kategori] || 0) + Number(i.tutar); });
  const dagilim = Object.entries(map).map(([ad, deger], idx) => ({ ad, deger, renk: KATEGORI_RENK[idx % KATEGORI_RENK.length] })).sort((a,b) => b.deger - a.deger);
  const dagilimToplam = raporDagilimTur === "gider" ? buGider : raporDagilimTur === "yatirim" ? buYatirim : buGelir;

  const kisiA = buYilIslemler.filter((i) => i.tur === "gider" && i.kisi === "a").reduce((s,i) => s + Number(i.tutar), 0);
  const kisiB = buYilIslemler.filter((i) => i.tur === "gider" && i.kisi === "b").reduce((s,i) => s + Number(i.tutar), 0);
  const maxKisi = Math.max(kisiA, kisiB, 1);

  icerik.innerHTML = `
    <div class="modal-header">
      <h3 class="modal-title">Yıllık Rapor</h3>
      <button class="icon-btn" onclick="yillikRaporKapat()">${IKON.kapat}</button>
    </div>
    <div class="ay-nav" style="margin-bottom:6px;">
      <button onclick="yillikRaporYilDegistir(-1)">${IKON.sol}</button>
      <span class="ay-label">${raporYili}</span>
      <button onclick="yillikRaporYilDegistir(1)">${IKON.sag}</button>
    </div>

    <div class="summary-grid">
      <div class="summary-card"><p class="summary-label">Gelir <span style="color:${buGelir>=gecenGelir?'#4F6F52':'#A85C3B'};">(${yuzdeDegisim(buGelir, gecenGelir)})</span></p><p class="summary-value" style="color:#4F6F52;">${TL(buGelir)}</p></div>
      <div class="summary-card"><p class="summary-label">Gider <span style="color:${buGider<=gecenGider?'#4F6F52':'#A85C3B'};">(${yuzdeDegisim(buGider, gecenGider)})</span></p><p class="summary-value" style="color:#A85C3B;">${TL(buGider)}</p></div>
      <div class="summary-card"><p class="summary-label">Yatırım</p><p class="summary-value" style="color:${YATIRIM_RENGI};">${TL(buYatirim)}</p></div>
      <div class="summary-card"><p class="summary-label">Bakiye</p><p class="summary-value" style="color:${(buGelir-buGider-buYatirim)>=0?'#3F6B66':'#8B3A3A'};">${TL(buGelir-buGider-buYatirim)}</p></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h2 class="card-title">Ay ay gelir / gider</h2>
      <div style="margin:8px 0 4px;">${trendSvg(aylikGelir, aylikGider, 300, 110)}</div>
      <div style="display:flex;gap:14px;justify-content:center;font-size:11.5px;color:#7A6A55;">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#4F6F52;margin-right:4px;"></span>Gelir</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#A85C3B;margin-right:4px;"></span>Gider</span>
      </div>
    </div>

    <div class="card">
      <h2 class="card-title">Yıllık Nakit Akışı</h2>
      <p class="bos-metin" style="margin-bottom:10px;">Kredi kartı harcamalarınız ekstre ödenene kadar buraya dahil olmaz, sadece gerçek nakit çıkışını gösterir.</p>
      <div class="bar-label-row"><span style="font-weight:600;">Giren nakit (Gelir)</span><span style="font-family:monospace;color:#4F6F52;font-weight:700;">${TL(buGelir)}</span></div>
      <div class="bar-label-row" style="margin-top:6px;"><span style="font-weight:600;">Çıkan ödeme</span><span style="font-family:monospace;color:#A85C3B;font-weight:700;">${TL(yilNakitOdeme)}</span></div>
      <div class="bar-label-row" style="margin-top:6px;"><span style="font-weight:600;">Yatırıma giden</span><span style="font-family:monospace;color:${YATIRIM_RENGI};font-weight:700;">${TL(buYatirim)}</span></div>
      <div class="bar-label-row" style="margin-top:6px;border-top:1px solid #EFE7D4;padding-top:8px;"><span style="font-weight:700;">Nakit bakiye</span><span style="font-family:monospace;font-weight:700;color:${yilNakitBakiye>=0?'#3F6B66':'#8B3A3A'};">${TL(yilNakitBakiye)}</span></div>
    </div>

    <div class="card">
      <div class="card-header-row">
        <h2 class="card-title">Yıllık dağılım</h2>
        <div class="toggle-pill">
          <button class="pill-btn ${raporDagilimTur==='gider'?'active':''}" style="${raporDagilimTur==='gider'?'background:#A85C3B;':''}" onclick="yillikRaporDagilimSec('gider')">Gider</button>
          <button class="pill-btn ${raporDagilimTur==='gelir'?'active':''}" style="${raporDagilimTur==='gelir'?'background:#4F6F52;':''}" onclick="yillikRaporDagilimSec('gelir')">Gelir</button>
          <button class="pill-btn ${raporDagilimTur==='yatirim'?'active':''}" style="${raporDagilimTur==='yatirim'?'background:'+YATIRIM_RENGI+';':''}" onclick="yillikRaporDagilimSec('yatirim')">Yatırım</button>
        </div>
      </div>
      ${dagilim.length === 0 ? `<p class="bos-metin">Bu yıl için henüz ${raporDagilimTur} kaydı yok.</p>` : `
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex-shrink:0;">${donutSvg(dagilim, 128)}</div>
        <div style="flex:1;min-width:0;">
          ${dagilim.slice(0,6).map(d => `
            <div class="legend-row">
              <span class="legend-dot" style="background:${d.renk};"></span>
              <span class="legend-ad">${esc(d.ad)}</span>
              <span class="legend-yuzde">${TL(d.deger)} · %${dagilimToplam ? Math.round(d.deger/dagilimToplam*100) : 0}</span>
            </div>`).join("")}
        </div>
      </div>`}
    </div>

    <div class="card">
      <h2 class="card-title">Kişiye göre yıllık gider</h2>
      <div style="margin-bottom:10px;">
        <div class="bar-label-row"><span style="font-weight:600;">${esc(kisiler.a)}</span><span style="font-family:monospace;">${TL(kisiA)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${kisiA/maxKisi*100}%;background:#4F6F52;"></div></div>
      </div>
      <div>
        <div class="bar-label-row"><span style="font-weight:600;">${esc(kisiler.b)}</span><span style="font-family:monospace;">${TL(kisiB)}</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${kisiB/maxKisi*100}%;background:#5A7D8C;"></div></div>
      </div>
    </div>
  `;
}

  localStorage.removeItem("hane-defteri-kodu");
  location.reload();
}
